<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>disco cube</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

<!-- КНОПКИ -->
<div style="position:absolute; top:20px; left:20px; z-index:9999;">
  <button onclick="addCubes()">➕ Додати кубики</button>
  <br><br>
  <button onclick="removeCubes()">➖ Видалити кубики</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ===== СЦЕНА =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// ===== КАМЕРА =====
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 2, 5);

// ===== РЕНДЕР =====
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ===== СВІТЛО (ПОФІКСЕНО) =====
const light = new THREE.PointLight(0xffffff, 3);
light.position.set(2, 5, 3);
scene.add(light);

scene.add(new THREE.AmbientLight(0x666666));

// ===== ПІДЛОГА =====
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshBasicMaterial({ color: 0x222222 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// ===== ГОЛОВНИЙ КУБ =====
const box = new THREE.Mesh(
  new THREE.BoxGeometry(),
  new THREE.MeshStandardMaterial({ color: 0xff0000 })
);
box.position.y = 1;
scene.add(box);

// ===== КУБИ =====
const cubes = [];

// ===== ДОДАТИ КУБИ (З ЛІМІТОМ) =====
window.addCubes = function () {
  if (cubes.length >= 50) return; // ЛІМІТ

  for (let i = 0; i < 5; i++) {
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(),
      new THREE.MeshStandardMaterial({
        color: Math.random() * 0xffffff
      })
    );

    cube.position.set(
      (Math.random() - 0.5) * 10,
      1,
      (Math.random() - 0.5) * 10
    );

    scene.add(cube);
    cubes.push(cube);
  }
};

// ===== ВИДАЛИТИ КУБИ =====
window.removeCubes = function () {
  cubes.forEach(cube => scene.remove(cube));
  cubes.length = 0;
};

// ===== АНИМАЦІЯ (ВСІ КУБИ КРУТЯТЬСЯ) =====
function animate() {
  requestAnimationFrame(animate);

  box.rotation.y += 0.01;

  cubes.forEach(cube => {
    cube.rotation.y += 0.01;
  });

  renderer.render(scene, camera);
}

animate();

</script>

</body>
</html>
<div style="position:absolute; bottom:10px;  width:100%;
  text-align:center; color:white;">
  
Бажано ввімкнути музику для дискотеки для більшого вайбу 🪩🎶
